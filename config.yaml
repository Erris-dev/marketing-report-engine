source:
  table: bigquery-public-data.ga4_obfuscated_sample_ecommerce.events_*
  start_date: 2020-11-01
  end_date: 2021-01-31
  max_bytes_billed_gb: 5     # BigQuery refuses any query that would scan more
  raw_path: data/raw/ga4_daily.parquet

report:
  timezone: UTC              # GA4 event_date in this dataset is the UTC date (verified)
  baseline_days: 28
  currency: USD

channels:
  # Mapping lives in sql/channel_case.sql; see docs/DATA_NOTES.md.
  paid: [paid_search]
  # other channels: organic_search, referral, direct, other, unknown

spend_simulation:
  seed: 42
  # spend = daily_budget_base * seasonality_factor * noise (see src/mre/sources/sim_spend.py)
  daily_budget_base:         # per paid channel, currency units per day
    default: 50              # ~0.60 per session on real paid_search traffic
  noise_sigma: 0.10          # day-to-day log-normal noise
  seasonality: true          # bump around Black Friday / Cyber Monday / Christmas
  planted_anomalies:         # deliberate test signal for anomaly detection (phase 5)
    - {channel: paid_search, week: "2021-W02", cost_multiplier: 2.0}
  output_path: data/raw/sim_spend.parquet

anomaly:
  method: robust_z           # median + MAD
  z_threshold: 3.5
  min_baseline_days: 14
  rules:
    cost_wow_increase: 0.40            # CPA or cost per session up by more than 40% WoW
    conversion_rate_wow_drop: 0.30     # conversion rate down by more than 30% WoW...
    sessions_stable_max_change: 0.10   # ...while sessions moved less than 10% WoW
    revenue_share_change_pp: 15        # channel revenue share moved > 15 percentage points

llm:
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  model: google/gemini-3.1-flash-lite
  temperature: 0.2
  max_retries: 1
  timeout_seconds: 60
  cache_dir: data/llm_cache

delivery:
  method: email              # email | none (none just saves the PDF)
  email:
    smtp_host: smtp.gmail.com
    smtp_port: 587
    use_starttls: true
    subject_template: "Weekly marketing report {week}"
