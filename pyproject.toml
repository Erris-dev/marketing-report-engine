[project]
name = "marketing-report-engine"
version = "0.1.0"
description = "Turns GA4 e-commerce data into a weekly marketing analysis PDF."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-bigquery>=3.25",
    "pyarrow>=17",
    "duckdb>=1.1",
    "pandas>=2.2",
    "pandera>=0.20",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "openai>=1.40",
    "matplotlib>=3.9",
    "jinja2>=3.1",
    "typer>=0.12",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# WeasyPrint needs Pango/Cairo system libraries; PDFs are built inside Docker.
pdf = ["weasyprint>=62"]

[project.scripts]
mre = "mre.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-pyyaml>=6.0",
    "pandas-stubs>=3.0.5.260914",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mre"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["mre"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["google.cloud.*", "pyarrow.*", "duckdb.*", "weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["mre"]
branch = true
